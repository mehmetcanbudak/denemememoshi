[package]
name = "memoshi-mls-native"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.82.0"
license = "Apache-2.0"

[lib]
name = "memoshi_mls_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["bindgen", "vendor/mls-rs-crypto-cryptokit"]
resolver = "2"

[dependencies]
mls-rs = { git = "https://github.com/awslabs/mls-rs", rev = "a1436f4a5433214ed62349e77835b57a0accdc42", default-features = false, features = ["std", "rfc_compliant", "tree_index", "serde"] }
mls-rs-core = { git = "https://github.com/awslabs/mls-rs", rev = "a1436f4a5433214ed62349e77835b57a0accdc42", default-features = false, features = ["std", "serde"] }
mls-rs-crypto-cryptokit = { path = "vendor/mls-rs-crypto-cryptokit" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
uniffi = { version = "=0.32.2", default-features = false }
zeroize = { version = "=1.8.2", features = ["derive", "serde"] }

[profile.release]
panic = "unwind"
# Rust LLVM stripping can misalign Mach-O LINKEDIT on macOS 27 (rust-lang/rust#157750).
# Preserve valid code; do not lower the deployment target or bypass dyld validation.
strip = "none"

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(mls_build_async)'] }
